x-application-environment: &application-environment
  COMPLIANCE_DATABASE_URL: postgresql+psycopg://compliance:compliance@postgres:5432/compliance
  COMPLIANCE_ENVIRONMENT: development
  COMPLIANCE_AUTH_MODE: development
  COMPLIANCE_MODEL_PROVIDER: deterministic

x-application: &application
  build:
    context: .
  environment: *application-environment
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_DB: compliance
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: compliance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance -d compliance"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - compliance-data:/var/lib/postgresql/data

  migrate:
    <<: *application
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *application
    ports:
      - "${COMPLIANCE_API_PORT:-8001}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    <<: *application
    command: ["python", "-m", "app.worker"]

  reaper:
    <<: *application
    command: ["python", "-m", "app.reaper"]

  notifier:
    <<: *application
    command: ["python", "-m", "app.notifier"]
    profiles: ["notifications"]
    environment:
      <<: *application-environment
      COMPLIANCE_NOTIFICATION_WEBHOOK_URL: ${COMPLIANCE_NOTIFICATION_WEBHOOK_URL:-}
      COMPLIANCE_NOTIFICATION_WEBHOOK_SECRET: ${COMPLIANCE_NOTIFICATION_WEBHOOK_SECRET:-}

volumes:
  compliance-data:
