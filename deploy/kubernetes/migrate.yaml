apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: compliance
  labels:
    app.kubernetes.io/name: ai-compliance-agent
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-compliance-agent
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: wait-for-postgres
          image: postgres:17.5-bookworm
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h postgres -U compliance -d compliance; do sleep 2; done"]
      containers:
        - name: migrate
          image: ai-compliance-agent:local
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: compliance-config
            - secretRef:
                name: compliance-database
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
