apiVersion: v1
kind: Secret
metadata:
  name: compliance-database
  namespace: compliance
  labels:
    app.kubernetes.io/name: ai-compliance-agent
type: Opaque
stringData:
  # Local reference credential, the same value Compose uses. Replace it outside a local cluster.
  POSTGRES_USER: compliance
  POSTGRES_PASSWORD: compliance
  COMPLIANCE_DATABASE_URL: postgresql+psycopg://compliance:compliance@postgres:5432/compliance
