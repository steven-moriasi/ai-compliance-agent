name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check app tests evals alembic
      - run: mypy app evals
      - run: python -m evals.run evals/cases/v1.json
      - run: >-
          pytest --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: compliance
          POSTGRES_USER: compliance
          POSTGRES_PASSWORD: compliance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compliance -d compliance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      COMPLIANCE_DATABASE_URL: postgresql+psycopg://compliance:compliance@localhost:5432/compliance
      COMPLIANCE_TEST_DATABASE_URL: postgresql+psycopg://compliance:compliance@localhost:5432/compliance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: pytest -m postgres tests/test_postgres_concurrency.py

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: ai-compliance-agent:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
