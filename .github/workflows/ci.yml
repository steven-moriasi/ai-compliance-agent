name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check app tests alembic
      - run: mypy app
      - run: >-
          pytest --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: compliance
          POSTGRES_USER: compliance
          POSTGRES_PASSWORD: compliance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compliance -d compliance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      COMPLIANCE_DATABASE_URL: postgresql+psycopg://compliance:compliance@localhost:5432/compliance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: ai-compliance-agent:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
