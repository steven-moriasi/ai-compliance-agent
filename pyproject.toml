[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-compliance-agent"
version = "0.1.0"
description = "Human-reviewed compliance analysis reference implementation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "alembic==1.16.1",
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "PyJWT[crypto]==2.10.1",
    "prometheus-client==0.22.1",
    "psycopg[binary]==3.2.9",
    "pydantic-settings==2.9.1",
    "sqlalchemy==2.0.52",
    "structlog==25.4.0",
    "uvicorn[standard]==0.34.3",
]

[project.optional-dependencies]
dev = [
    "mypy==1.16.0",
    "pytest==8.4.0",
    "pytest-cov==6.1.1",
    "ruff==0.11.13",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
