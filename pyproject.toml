[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-compliance-agent"
version = "0.1.0"
description = "Human-reviewed compliance analysis reference implementation"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
dependencies = [
    "alembic==1.16.1",
    "defusedxml==0.7.1",
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "PyJWT[crypto]==2.10.1",
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "structlog==25.4.0",
    "uvicorn[standard]==0.34.3",
]

[project.optional-dependencies]
dev = [
    "mypy==1.16.0",
    "pytest==8.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
]
retrieval = [
    "sentence-transformers==6.1.0",
    "torch==2.14.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"
markers = [
    "postgres: tests that require COMPLIANCE_TEST_DATABASE_URL and PostgreSQL",
    "local_model: tests that call a running local model server",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
